<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d32f2f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- White circular background -->
  <circle cx="16" cy="16" r="15" fill="white" stroke="#4caf50" stroke-width="2"/>
  
  <!-- Shield shape -->
  <path d="M9 6 L9 12 Q9 18 16 26 Q23 18 23 12 L23 6 Q16 2 9 6 Z" 
        fill="url(#shieldGradient)" 
        stroke="#2e7d32" 
        stroke-width="1"/>
  
  <!-- CH Text -->
  <text x="16" y="18" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="8" font-weight="bold" fill="url(#textGradient)">CH</text>
        
  <!-- Small gear icon for H -->
  <circle cx="18.5" cy="16.5" r="1.5" fill="#d32f2f"/>
  <path d="M17 16.5 L18.5 15.5 L20 16.5 L18.5 17.5 Z" fill="#d32f2f" opacity="0.6"/>
</svg>
