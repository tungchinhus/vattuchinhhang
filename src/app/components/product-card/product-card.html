<div class="product-card">
  <div class="product-image">
    <img [src]="product.image" [alt]="product.name">
    <div class="product-badge" *ngIf="product.isNew">Mới</div>
    <div class="product-badge sale" *ngIf="product.isSale">Giảm giá</div>
    
    <!-- Hover overlay với đặc điểm sản phẩm -->
    <div class="hover-overlay" *ngIf="product.features && product.features.length > 0">
      <div class="features-list">
        <h4 class="features-title">Đặc điểm nổi bật:</h4>
        <ul class="features-items">
          <li *ngFor="let feature of product.features">{{ feature }}</li>
        </ul>
      </div>
    </div>
  </div>
  
  <div class="product-info">
    <h3 class="product-name">{{ product.name }}</h3>
    <p class="product-description">{{ product.description }}</p>
    
    <div class="product-price">
      <span class="current-price">{{ product.price }}</span>
      <span class="old-price" *ngIf="product.oldPrice">{{ product.oldPrice }}</span>
    </div>
    
    <div class="product-rating" *ngIf="product.rating">
      <div class="stars">
        <mat-icon *ngFor="let star of getStars(product.rating)">{{ star }}</mat-icon>
      </div>
      <span class="rating-text">({{ product.reviews }})</span>
    </div>
    
    <div class="product-actions">
      <button mat-raised-button color="primary" class="add-to-cart-btn">
        <mat-icon>shopping_cart</mat-icon>
        Thêm vào giỏ
      </button>
      <button mat-icon-button class="favorite-btn">
        <mat-icon>favorite_border</mat-icon>
      </button>
    </div>
  </div>
</div>
